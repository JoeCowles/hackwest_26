[package]
name = "ciderd"
description = "macOS storage telemetry collectors and latest-state heartbeat daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ciderd"
path = "src/lib.rs"

[[bin]]
name = "ciderd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
plist = "1.7"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal", "fs", "net", "test-util"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.23"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
