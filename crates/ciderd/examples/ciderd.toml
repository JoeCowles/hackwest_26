# Example configuration; illustrative endpoint and installation paths.
# Root owns this file and all executable/credential paths.
[node]
identity_file = "/Library/Application Support/Ciderd/node.json"
state_directory = "/Library/Application Support/Ciderd/state"

[heartbeat]
endpoint = "https://127.0.0.1:8787/api/v2/ciderd/heartbeat"
bearer_token_file = "/Library/Application Support/Ciderd/credentials/token"
# Optional private deployment CA, in addition to system trust:
# ca_certificate_file = "/Library/Application Support/Ciderd/credentials/ca.pem"
interval_seconds = 5
connect_timeout_seconds = 3
request_timeout_seconds = 8
maximum_backoff_seconds = 60
maximum_request_bytes = 1048576
maximum_response_bytes = 16384
delivery_mode = "latest"
follow_redirects = false

[collection]
io_seconds = 3
mount_inventory_seconds = 3
nfs_counters_seconds = 15
nfs_status_seconds = 3
capacity_seconds = 15
smart_seconds = 15
inventory_reconcile_seconds = 3
apfs_accounting_seconds = 15
jitter_percent = 0
nfs_path_refresh_enabled = true
active_write_probes_enabled = false
diagnostic_jobs_enabled = false

[limits]
command_workers = 4
native_workers = 2
remote_workers = 4
workers_per_resource = 1
stdout_bytes = 2097152
stderr_bytes = 65536
pending_events = 256
recent_sample_history = 0

[tools]
# Optional: pin a verified installation path before enabling SMART.
# smartctl = "/opt/homebrew/sbin/smartctl"

# Optional, read-only NFS user quotas. Empty targets is unconfigured.
# Server filesystem quotas may span multiple exports. Never sum these rows.
[nfs_quotas]
interval_seconds = 15
timeout_seconds = 3
# [[nfs_quotas.targets]]
# server = "nfs.internal.example"
# export_path = "/srv/inference"
# uid = 501
# display_label = "Inference service"
# port = 875 # omit for bounded UDP portmapper lookup on the configured server
