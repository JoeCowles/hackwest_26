# Standalone workspace root, deliberately not a member of the parent workspace,
# so this crate can be added without touching the root Cargo.toml.
[workspace]

[package]
name = "orchard-nfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Node-side NFS provisioning and telemetry collection for Orchard"

[[bin]]
name = "orchard-nfs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
